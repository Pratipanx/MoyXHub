name: Moy Hub - Script Notify

on:
  push:
    branches: [main]
    paths:
      - '*.txt'
      - '*.lua'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moy-hub-script-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Replace old script posts in Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: '1575741154782089316'
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import quote

          def git(*args):
              return subprocess.check_output(['git', *args]).decode('utf-8').split('\0')

          def scripts(files):
              return sorted({f for f in files if f and '/' not in f
                             and Path(f).suffix.lower() in ('.txt', '.lua')
                             and Path(f).stem.lower() not in ('readme', 'license', 'licence', 'changelog', 'notice', 'requirements')
                             and Path(f).is_file() and not Path(f).is_symlink()})

          def message(filename, legacy=False):
              name = Path(filename).stem
              name = name.replace('`', '').replace('\n', ' ').replace('\r', ' ')
              for char in ('*', '_', '~', '|', '>', '[' , ']'):
                  name = name.replace(char, '\\' + char)
              url = 'https://raw.githubusercontent.com/Pratipanx/MoyXHub/refs/heads/main/' + quote(filename, safe='')
              return (f'**💎 MOY HUB | {name}**\n\n'
                      f'🎮 แมพ : {name}\n'
                      '📜 Script : Free\n\n'
                      '```lua\n'
                      f'loadstring(game:HttpGet("{url}"))()\n'
                      '```\n' +
                      ('📋 กดคัดลอกโค้ดด้านบนเพื่อใช้งาน' if legacy else '📋 มือถือ: กดปุ่ม COPY SCRIPT ด้านล่าง'))

          def request(token, path, method='GET', payload=None):
              req = urllib.request.Request(
                  'https://discord.com/api/v10' + path,
                  data=None if payload is None else json.dumps(payload).encode('utf-8'),
                  headers={'Authorization': 'Bot ' + token, 'Content-Type': 'application/json', 'User-Agent': 'DiscordBot (https://github.com/Pratipanx/MoyXHub, 3.0)'},
                  method=method,
              )
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read()
                          return json.loads(body) if body else None
                  except urllib.error.HTTPError as exc:
                      if exc.code == 429 and attempt < 4:
                          delay = float(json.loads(exc.read()).get('retry_after', 2))
                          time.sleep(max(1, delay) + 0.2)
                          continue
                      if exc.code == 404 and method == 'DELETE':
                          return None
                      raise SystemExit(f'Discord HTTP {exc.code}: check token, channel ID, permissions or rate limit.') from None

          def history(token, channel):
              base = f'/channels/{channel}/messages'
              before = ''
              while True:
                  page = request(token, base + '?limit=100' + before)
                  if not isinstance(page, list):
                      raise SystemExit('Unexpected Discord message history response.')
                  yield from page
                  if len(page) < 100:
                      break
                  before = '&before=' + min((m['id'] for m in page), key=int)

          def matching_posts(messages, bot_id, filename):
              # Exact full message match: never delete members' messages,
              # other bots' messages, or posts for another file/map.
              return [m['id'] for m in messages
                      if m.get('author', {}).get('id') == bot_id
                      and not m.get('webhook_id')
                      and m.get('content') in (message(filename), message(filename, legacy=True))]

          def replace(token, channel, filename, bot_id, messages):
              old_ids = matching_posts(messages, bot_id, filename)
              nonce = hashlib.sha256((channel + ':' + os.environ['GITHUB_RUN_ID'] + ':' + filename).encode()).hexdigest()[:24]
              copy_url = 'https://pratipanx.github.io/MoyXHub/copy.html?file=' + quote(filename, safe='')
              payload = {'content': message(filename), 'allowed_mentions': {'parse': []}, 'nonce': nonce, 'enforce_nonce': True,
                         'components': [{'type': 1, 'components': [{'type': 2, 'style': 5, 'label': '📋 COPY SCRIPT (มือถือ)', 'url': copy_url}]}]}
              base = f'/channels/{channel}/messages'
              new = request(token, base, 'POST', payload)
              if not isinstance(new, dict) or not new.get('id') or new.get('author', {}).get('id') != bot_id or new.get('content') != message(filename):
                  raise SystemExit('New post could not be confirmed; old posts were not deleted.')
              print(f'Sent {filename}: {new["id"]}')
              for old_id in old_ids:
                  if old_id != new['id']:
                      request(token, base + '/' + old_id, 'DELETE')
                      print(f'Removed previous post: {old_id}')
                      time.sleep(0.3)

          def main():
              token = os.environ['DISCORD_BOT_TOKEN'].strip()
              if not token:
                  raise SystemExit('Missing DISCORD_BOT_TOKEN repository secret.')
              before = os.environ.get('BEFORE_SHA', '')
              if os.environ['EVENT_NAME'] == 'workflow_dispatch' or not before or not before.strip('0'):
                  files = git('ls-files', '-z')
              else:
                  files = git('diff', '--name-only', '--diff-filter=AMRT', '-z', before, os.environ['COMMIT_SHA'], '--')
              selected = scripts(files)
              if not selected:
                  print('No matching script files to announce.')
                  return
              channel = os.environ['CHANNEL_ID']
              bot_id = request(token, '/users/@me')['id']
              messages = list(history(token, channel))
              for filename in selected:
                  replace(token, channel, filename, bot_id, messages)
                  time.sleep(1)

          if __name__ == '__main__':
              main()
          PY
